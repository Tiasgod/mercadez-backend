name: Mercadez - Descobrir Catalogo Nagumo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: descoberta-catalogo-nagumo
  cancel-in-progress: false

jobs:
  descobrir-catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Descobrir lojas e categorias
        run: |
          set -o pipefail
          python -u -m app.scripts.descobrir_lojas 2>&1 | tee descoberta.log

      - name: Salvar arquivos de descoberta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-nagumo
          path: |
            lojas_nagumo_regiao.json
            catalogo_nagumo.json
            relatorio_descoberta.json
            descoberta.log
          retention-days: 7

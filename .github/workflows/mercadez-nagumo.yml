name: Mercadez - Nagumo V5

on:
  schedule:
    - cron: "0 11,23 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercadez-nagumo
  cancel-in-progress: false

jobs:

  coletar:

    name: Atualizacao Regional - 15 Nagumos

    if: ${{ vars.NAGUMO_COLETA_AUTORIZADA == 'true' }}

    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # =====================================================
      # BAIXAR REPOSITORIO
      # =====================================================

      - name: Baixar repositorio
        uses: actions/checkout@v6

      # =====================================================
      # CONFIGURAR PYTHON
      # =====================================================

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # =====================================================
      # VERIFICAR ARQUIVOS
      # =====================================================

      - name: Verificar arquivos
        run: |
          test -f app/scripts/scraper_nagumo.py
          test -f catalogo_nagumo.json

          python -m py_compile app/scripts/scraper_nagumo.py

          python -m json.tool catalogo_nagumo.json > /dev/null

          echo "[OK] Scraper encontrado."
          echo "[OK] Catalogo encontrado."

      # =====================================================
      # INSTALAR DEPENDENCIAS
      # =====================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright

      # =====================================================
      # INSTALAR CHROMIUM
      # =====================================================

      - name: Instalar Chromium
        run: |
          python -m playwright install --with-deps chromium

      # =====================================================
      # PREPARAR DIAGNOSTICO
      # =====================================================

      - name: Preparar diagnostico
        run: |
          mkdir -p diagnostico

      # =====================================================
      # COLETA REAL - TODAS AS 15 LOJAS
      # =====================================================

      - name: Atualizar produtos precos e imagens
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"

        shell: bash

        run: |
          set -o pipefail

          python -u -m app.scripts.scraper_nagumo \
            --todas-lojas \
            --catalogo catalogo_nagumo.json \
            --categorias \
              acougue \
              basicos-e-matinais \
              bazar \
              bebidas \
              frios-e-laticinios \
              hortifruti \
              limpeza \
              padaria \
              peixaria \
              pet-shop \
            2>&1 | tee diagnostico/coleta.log

      # =====================================================
      # SALVAR RESULTADOS
      # =====================================================

      - name: Salvar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercadez-nagumo-resultados
          path: |
            diagnostico/
            catalogo_nagumo.json
          retention-days: 7

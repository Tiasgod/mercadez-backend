name: Mercadez - Nagumo V5

on:
  workflow_dispatch:
    inputs:
      operacao:
        description: "Selecione a operacao"
        required: true
        default: "testar"
        type: choice
        options:
          - testar
          - planejar
          - descobrir

permissions:
  contents: read

concurrency:
  group: mercadez-nagumo
  cancel-in-progress: false

jobs:
  nagumo:

    name: Mercadez - Nagumo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Preparar diagnostico
        run: |
          mkdir -p diagnostico

      - name: Validar scraper
        run: |
          test -f app/scripts/scraper_nagumo.py
          python -m py_compile app/scripts/scraper_nagumo.py

      # =====================================================
      # TESTE SEGMENTADO
      # =====================================================

      - name: Testar subcategorias do acougue
        if: ${{ inputs.operacao == 'testar' }}
        run: |
          set -o pipefail

          python -u -m app.scripts.scraper_nagumo \
            --testar-segmentado \
            --catalogo catalogo_nagumo.json \
            2>&1 | tee diagnostico/teste_segmentado.log

      # =====================================================
      # PLANEJAMENTO
      # =====================================================

      - name: Planejar catalogo
        if: ${{ inputs.operacao == 'planejar' }}
        run: |
          set -o pipefail

          python -u -m app.scripts.scraper_nagumo \
            --planejar \
            --catalogo catalogo_nagumo.json \
            2>&1 | tee diagnostico/planejamento.log

      # =====================================================
      # DESCOBERTA
      # =====================================================

      - name: Instalar Playwright
        if: ${{ inputs.operacao == 'descobrir' }}
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Descobrir catalogo Nagumo
        if: ${{ inputs.operacao == 'descobrir' }}
        run: |
          set -o pipefail

          python -u descobrir_lojas.py \
            2>&1 | tee diagnostico/descoberta.log

      # =====================================================
      # RESULTADOS
      # =====================================================

      - name: Salvar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercadez-nagumo-resultados
          path: |
            diagnostico/
            catalogo_nagumo.json
            lojas_nagumo_regiao.json
            relatorio_descoberta.json
          retention-days: 7

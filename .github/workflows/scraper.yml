name: Mercadez - Atualizacao Regional Nagumo

on:
  schedule:
    - cron: "15 */6 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercadez-scraper-imagens
  cancel-in-progress: false

jobs:
  atualizar-catalogo:

    name: ${{ matrix.grupo }} - Loja ${{ matrix.codigo }}

    runs-on: ubuntu-latest

    timeout-minutes: 350

    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        include:

          # POA

          - grupo: Poa
            nome: "Nagumo Poa"
            codigo: "22"

          - grupo: Poa
            nome: "Nagumo Poa_Kemel"
            codigo: "45"

          # SUZANO

          - grupo: Suzano
            nome: "Nagumo_Suzano_Dona_Benta"
            codigo: "23"

          - grupo: Suzano
            nome: "Nagumo Suzano"
            codigo: "27"

          # ITAQUAQUECETUBA

          - grupo: Itaquaquecetuba
            nome: "Nagumo Itaqua"
            codigo: "30"

          - grupo: Itaquaquecetuba
            nome: "Nagumo_Itaqua_Vila_Zeferina"
            codigo: "39"

          # MOGI DAS CRUZES

          - grupo: Mogi
            nome: "Nagumo_Mogi_Alto_Ipiranga"
            codigo: "52"

          # GUARULHOS

          - grupo: Guarulhos
            nome: "Nagumo_Guarulhos_Merc_Bonsucesso"
            codigo: "41"

          - grupo: Guarulhos
            nome: "Nagumo_Guarulhos_Cumbica"
            codigo: "42"

          - grupo: Guarulhos
            nome: "Nagumo_Guarulhos_Shopping_Pimentas"
            codigo: "49"

          - grupo: Guarulhos
            nome: "Nagumo_Guarulhos_Continental"
            codigo: "51"

          - grupo: Guarulhos
            nome: "Nagumo_Guarulhos_Bonsucesso"
            codigo: "55"

          - grupo: Guarulhos
            nome: "Nagumo_Guarulhos_Elenco"
            codigo: "56"

          - grupo: Guarulhos
            nome: "Nagumo_Guarulhos_Anel_Viario"
            codigo: "57"

          - grupo: Guarulhos
            nome: "Nagumo_Guarulhos_Alvorada"
            codigo: "61"

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Atualizar precos e imagens
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
          LOJA_NOME: ${{ matrix.nome }}
          LOJA_CODIGO: ${{ matrix.codigo }}

        shell: bash

        run: |
          set -o pipefail

          python -m app.scripts.scraper_nagumo \
            --loja "$LOJA_NOME" \
            --loja-codigo "$LOJA_CODIGO" \
            --todos 2>&1 | tee scraper.log

          if grep -Eq '\[ERRO\]|Coleta parcial' scraper.log; then
            echo "Foram identificadas falhas na coleta."
            exit 1
          fi
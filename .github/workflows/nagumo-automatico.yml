name: Mercadez - Atualizacao Regional Nagumo V5

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercadez-nagumo-v5
  cancel-in-progress: false

jobs:

  planejar-catalogo:

    name: Planejamento de Subcategorias Nagumo

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # =====================================================
      # BAIXAR REPOSITORIO
      # =====================================================

      - name: Baixar repositorio
        uses: actions/checkout@v6

      # =====================================================
      # CONFIGURAR PYTHON
      # =====================================================

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # =====================================================
      # VERIFICAR ARQUIVOS
      # =====================================================

      - name: Verificar arquivos obrigatorios
        run: |
          test -f app/scripts/scraper_nagumo.py
          test -f catalogo_nagumo.json

          python -m py_compile app/scripts/scraper_nagumo.py

          python -m json.tool catalogo_nagumo.json > /dev/null

          echo "[OK] Scraper encontrado."
          echo "[OK] Catalogo encontrado."
          echo "[OK] Arquivos validados."

      # =====================================================
      # INSTALAR DEPENDENCIAS
      # =====================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright

      # =====================================================
      # PREPARAR DIAGNOSTICO
      # =====================================================

      - name: Preparar diretorio de diagnostico
        run: |
          mkdir -p diagnostico

      # =====================================================
      # PLANEJAR SUBCATEGORIAS DO ACOUGUE
      # =====================================================

      - name: Planejar subcategorias do acougue
        run: |
          set -o pipefail

          python -u -m app.scripts.scraper_nagumo \
            --planejar \
            --catalogo catalogo_nagumo.json \
            --categorias acougue \
            2>&1 | tee diagnostico/planejamento_acougue.log

      # =====================================================
      # PLANEJAR CATALOGO COMPLETO
      # =====================================================

      - name: Planejar catalogo completo
        run: |
          set -o pipefail

          python -u -m app.scripts.scraper_nagumo \
            --planejar \
            --catalogo catalogo_nagumo.json \
            2>&1 | tee diagnostico/planejamento_completo.log

      # =====================================================
      # SALVAR RESULTADOS
      # =====================================================

      - name: Salvar resultados e diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-nagumo-v5
          path: |
            diagnostico/
            catalogo_nagumo.json
          retention-days: 7

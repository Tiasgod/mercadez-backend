name: Mercadez - Nagumo Simplificado

"on":
  schedule:
    - cron: "49 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mercadez-scraper-imagens
  cancel-in-progress: false

jobs:
  atualizar-catalogo:
    name: Coleta sequencial Nagumo
    if: ${{ vars.NAGUMO_COLETA_AUTORIZADA == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright

      - name: Verificar pausa registrada no Neon
        id: pausa
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import text
          from app.core.database import SessionLocal

          with SessionLocal() as db:
              estado = db.execute(text(
                  "SELECT status_http, etapa FROM nagumo_coleta_pausa WHERE id = 1"
              )).first()

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"ativa={'true' if estado else 'false'}\n")

          if estado:
              print(f"Coleta suspensa: HTTP {estado[0]} em {estado[1]}.")
              print("Nenhuma nova consulta ao Nagumo sera realizada.")
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write("## Coleta suspensa\n\nExiste uma recusa anterior registrada no Neon.\n")
          else:
              print("Nenhuma pausa registrada.")
          PY

      - name: Instalar Chromium
        if: steps.pausa.outputs.ativa == 'false'
        run: python -m playwright install --with-deps chromium

      - name: Executar scraper Nagumo
        if: steps.pausa.outputs.ativa == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Commit: $GITHUB_SHA"
          python --version
          python -m playwright --version
          TZ=America/Sao_Paulo date
          python -m app.scripts.scraper_nagumo --todas-lojas --todos
